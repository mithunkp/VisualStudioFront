<aside class="bg-[#110f19]/82 border border-white/5 backdrop-blur-md rounded-2xl p-5 shadow-[0_10px_30px_-10px_rgba(0,0,0,0.5)] transition-all duration-300 hover:border-purple-500/20 hover:shadow-[0_15px_35px_-5px_rgba(168,85,247,0.05)] w-full">
  <div class="flex items-center justify-between gap-4 mb-4">
    <h2 class="text-base font-bold tracking-tight text-white">Direct the look</h2>
  </div>

  <div class="grid gap-2 mb-4">
    <label class="text-gray-400 text-xs font-semibold">Crop focus</label>
    <div class="grid grid-cols-3 p-1 bg-[#0e0d14] border border-white/5 rounded-lg">
      <button *ngFor="let position of cropPositions" class="p-2 text-gray-500 bg-transparent border-0 rounded-md capitalize cursor-pointer text-xs transition-all" [ngClass]="{ 'text-white bg-purple-500/18 shadow-[inset_0_0_0_1px_rgba(192,132,252,0.2)]': cropPosition === position, 'text-gray-500': cropPosition !== position }" (click)="onCropPositionChange(position)">{{ position }}</button>
    </div>
  </div>

  <div class="grid gap-2 mb-4">
    <label class="text-gray-400 text-xs font-semibold">On-screen text</label>
    <input class="w-full min-w-0 p-3 text-white bg-[#0e0d14] border border-white/5 rounded-lg outline-none transition-all focus:border-purple-500/60 focus:shadow-[0_0_0_3px_rgba(168,85,247,0.08)]" maxlength="60" [ngModel]="captionText" (ngModelChange)="onCaptionTextChange($event)" placeholder="Add a strong headline" />
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4">
    <div class="grid gap-2">
      <label class="text-gray-400 text-xs font-semibold">Font</label>
      <select class="w-full min-w-0 p-3 text-white bg-[#0e0d14] border border-white/5 rounded-lg outline-none transition-all focus:border-purple-500/60 focus:shadow-[0_0_0_3px_rgba(168,85,247,0.08)]" [ngModel]="captionFont" (ngModelChange)="onCaptionFontChange($event)">
        <option *ngFor="let font of fonts" [value]="font.value">{{ font.name }}</option>
      </select>
    </div>
    <div class="grid gap-2">
      <label class="text-gray-400 text-xs font-semibold">Position</label>
      <select class="w-full min-w-0 p-3 text-white bg-[#0e0d14] border border-white/5 rounded-lg outline-none transition-all focus:border-purple-500/60 focus:shadow-[0_0_0_3px_rgba(168,85,247,0.08)]" [ngModel]="captionPosition" (ngModelChange)="onCaptionPositionChange($event)">
        <option *ngFor="let position of captionPositions">{{ position }}</option>
      </select>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4">
    <label class="flex items-center justify-between p-2.5 px-3 text-gray-400 bg-[#0e0d14] border border-white/5 rounded-lg text-xs cursor-pointer">Text color <input type="color" class="w-6 h-6 p-0 overflow-hidden border-0 rounded-md bg-transparent cursor-pointer" [ngModel]="captionColor" (ngModelChange)="onCaptionColorChange($event)" /></label>
    <label class="flex items-center justify-between p-2.5 px-3 text-gray-400 bg-[#0e0d14] border border-white/5 rounded-lg text-xs cursor-pointer">Accent <input type="color" class="w-6 h-6 p-0 overflow-hidden border-0 rounded-md bg-transparent cursor-pointer" [ngModel]="accentColor" (ngModelChange)="onAccentColorChange($event)" /></label>
  </div>

  <div class="grid gap-2 mb-4">
    <label class="text-gray-400 text-xs font-semibold">Text animation</label>
    <div class="grid grid-cols-4 gap-1.5">
      <button *ngFor="let animation of animations" class="grid gap-1.5 place-items-center p-2 text-gray-500 bg-transparent border border-white/5 rounded-md capitalize cursor-pointer text-xs" [ngClass]="{ 'text-white bg-purple-500/18 shadow-[inset_0_0_0_1px_rgba(192,132,252,0.2)]': textAnimation === animation, 'text-gray-500': textAnimation !== animation }" (click)="onTextAnimationChange(animation)"><span class="w-[18px] h-1 rounded-sm bg-current"></span>{{ animation }}</button>
    </div>
  </div>

  <label class="grid grid-cols-[auto_1fr] gap-3 items-center p-3 border border-white/5 rounded-xl bg-white/[0.02] cursor-pointer mb-4">
    <input type="checkbox" [ngModel]="useAi" (ngModelChange)="onUseAiChange($event)" class="peer hidden" />
    <span class="w-[34px] h-[19px] relative rounded-full bg-[#292633] transition-all after:content-[''] after:absolute after:top-[3px] after:left-[3px] after:w-[13px] after:h-[13px] after:rounded-full after:bg-gray-400 after:transition-all peer-checked:bg-purple-600 peer-checked:after:left-[18px] peer-checked:after:bg-white"></span>
    <span class="grid gap-0.5"><strong class="text-xs font-semibold text-white">AI hook discovery</strong><small class="text-[10px] text-gray-500 leading-tight">{{ useAi ? 'Uses transcription + Gemini to find multiple hooks' : 'Off · selected section renders locally with zero AI tokens' }}</small></span>
  </label>

  <!-- Render button (for local files) -->
  <button *ngIf="selectedFile" class="inline-flex items-center justify-center px-6 py-3 rounded-xl font-bold text-sm cursor-pointer transition-all duration-200 border-none disabled:opacity-45 disabled:cursor-not-allowed bg-gradient-to-br from-purple-500 to-indigo-600 text-white shadow-[0_4px_15px_rgba(168,85,247,0.3)] hover:translate-y-[-1px] hover:shadow-[0_6px_20px_rgba(168,85,247,0.4)] w-full mt-1 justify-between" (click)="onRender()">Render selected section <span>→</span></button>
</aside>

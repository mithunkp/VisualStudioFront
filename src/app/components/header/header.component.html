<header class="flex flex-col lg:flex-row lg:items-center lg:justify-between text-left mb-6 gap-4 bg-[#110f19]/82 border border-white/5 backdrop-blur-md rounded-2xl p-5 shadow-[0_10px_30px_-10px_rgba(0,0,0,0.5)] transition-all duration-300 hover:border-purple-500/20 hover:shadow-[0_15px_35px_-5px_rgba(168,85,247,0.05)]">
  <div>
    <div class="flex items-center gap-3">
      <span class="grid place-items-center w-[38px] h-[38px] rounded-[11px] text-white text-[0.8rem] font-extrabold bg-gradient-to-br from-purple-500 to-blue-600 shadow-[0_0_22px_rgba(168,85,247,0.35)]">VS</span>
      <h1 class="m-0 font-headings text-2xl font-bold tracking-tight bg-gradient-to-r from-white via-purple-300 to-indigo-400 bg-clip-text text-transparent">Viral Studio</h1>
      <div class="flex items-center gap-2 px-3 py-1 text-[#bbf7d0] bg-green-500/10 border border-green-500/20 rounded-full text-[10px] font-semibold">
        <span class="w-1.5 h-1.5 rounded-full bg-green-400 shadow-[0_0_8px_#4ade80]"></span> Local-first
      </div>
    </div>
    <p class="max-w-none mt-1 text-sm text-gray-400">Build polished vertical clips locally. AI discovery on-demand.</p>
  </div>

  <!-- Top Source Selector (Justified right, compact size) -->
  <div class="flex items-center gap-3 shrink-0 self-start lg:self-auto">
    <!-- Tab selectors (visible only when no file is active) -->
    <div *ngIf="!selectedFile && processingState === 'IDLE'" class="flex bg-white/5 border border-white/5 rounded-xl p-1 gap-1 text-[11px]">
      <button class="px-3 py-1.5 rounded-lg bg-transparent text-gray-400 border border-transparent font-medium cursor-pointer transition-all hover:text-white hover:bg-white/[0.02]" [ngClass]="{ 'bg-purple-500/15 text-purple-200 border-purple-500/20 font-semibold': inputMode === 'FILE' }" (click)="onInputModeChange('FILE')">File</button>
      <button class="px-3 py-1.5 rounded-lg bg-transparent text-gray-400 border border-transparent font-medium cursor-pointer transition-all hover:text-white hover:bg-white/[0.02]" [ngClass]="{ 'bg-purple-500/15 text-purple-200 border-purple-500/20 font-semibold': inputMode === 'URL' }" (click)="onInputModeChange('URL')">URL</button>
    </div>

    <!-- Compact File Upload (FILE mode, no selected file) -->
    <div *ngIf="processingState === 'IDLE' && inputMode === 'FILE' && !selectedFile">
      <input type="file" id="videoFileHeader" accept="video/mp4" (change)="onFileSelected($event)" class="hidden" />
      <label for="videoFileHeader" class="px-4 py-2 text-xs font-bold text-white bg-purple-600/80 border border-purple-500/30 rounded-xl hover:bg-purple-600 hover:shadow-lg transition-all cursor-pointer inline-flex items-center gap-2 shrink-0">
        <span>+</span> Upload MP4
      </label>
    </div>

    <!-- Compact URL Input (URL mode, no selected file) -->
    <div *ngIf="processingState === 'IDLE' && inputMode === 'URL' && !selectedFile" class="flex items-center gap-2">
      <input type="text" [ngModel]="videoUrlInput" (ngModelChange)="onVideoUrlInputChange($event)" placeholder="Paste YouTube or direct MP4 URL" class="p-2 px-3 text-xs text-white bg-[#0e0d14] border border-white/5 rounded-lg outline-none w-[320px] md:w-[420px] focus:border-purple-500/60" />
      <button class="px-3 py-2 text-xs font-bold text-white bg-purple-600 border border-purple-500/30 rounded-lg disabled:opacity-45 cursor-pointer hover:bg-purple-600 flex items-center gap-1" [disabled]="!videoUrlInput" (click)="onProcessUrl()">Go <span>→</span></button>
    </div>

    <!-- Compact Active File indicator with change trigger -->
    <div *ngIf="selectedFile && processingState === 'IDLE'" class="flex items-center gap-3 p-1.5 px-3 bg-purple-500/5 border border-purple-500/10 rounded-xl">
      <span class="text-sm shrink-0">🎥</span>
      <span class="text-xs font-semibold text-white truncate max-w-[150px]" [title]="selectedFile.name">{{ selectedFile.name }}</span>
      <button class="text-[10px] font-bold text-purple-300 hover:text-purple-200 transition-all cursor-pointer ml-2 bg-white/5 border border-white/10 rounded px-2 py-0.5" (click)="onReset()">Change</button>
    </div>
  </div>
</header>

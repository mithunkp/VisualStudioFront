<section class="bg-[#110f19]/82 border border-white/5 backdrop-blur-md rounded-2xl p-5 shadow-[0_10px_30px_-10px_rgba(0,0,0,0.5)] transition-all duration-300 hover:border-purple-500/20 hover:shadow-[0_15px_35px_-5px_rgba(168,85,247,0.05)] w-full">
  <div class="flex items-center justify-between gap-4 mb-4">
    <h2 class="text-base font-bold tracking-tight text-white">{{ processingState === 'COMPLETE' ? 'Rendered output' : 'Vertical canvas' }}</h2>
    <span class="flex items-center gap-2 px-3 py-1.5 text-purple-300 bg-purple-500/5 border border-purple-500/15 rounded-full text-xs font-semibold">9:16</span>
  </div>
  
  <div class="grid place-items-center py-2 pb-4">
    <div class="relative overflow-hidden w-full max-w-[260px] aspect-[9/16] bg-gradient-to-br from-[#18131f] to-[#08070b] border-4 border-[#292631] rounded-[25px] shadow-[0_18px_35px_rgba(0,0,0,0.45),_0_0_0_1px_rgba(255,255,255,0.05)]">
      <video *ngIf="processingState === 'COMPLETE' && result" class="w-full h-full object-cover block" controls autoplay [src]="backendUrl + (selectedHook?.video_url || result.videoUrl)"></video>
      <video *ngIf="processingState !== 'COMPLETE' && localVideoUrl" class="w-full h-full object-cover block" muted autoplay loop [src]="localVideoUrl" [style.object-position]="cropPosition"></video>
      <div *ngIf="!localVideoUrl && processingState !== 'COMPLETE'" class="h-full grid place-content-center justify-items-center p-8 text-gray-500 text-center text-xs gap-3">
        <span class="grid place-items-center w-10.5 h-10.5 border border-dashed border-gray-500 rounded-full text-2xl font-light">+</span>
        <p>Your live preview appears here</p>
      </div>
      <div *ngIf="captionText && processingState !== 'COMPLETE'" class="caption-preview"
           [ngClass]="['caption-' + captionPosition, 'animation-' + textAnimation]"
           [style.font-family]="captionFont" [style.color]="captionColor" [style.--accent]="accentColor">{{ captionText }}</div>
    </div>
  </div>

  <div class="grid gap-1 p-3 border-t border-white/5" *ngIf="selectedFile && processingState === 'IDLE'">
    <span class="text-[#4ade80] text-[10px] font-extrabold tracking-[0.12em] uppercase">LIVE PREVIEW</span>
    <strong class="overflow-hidden text-ellipsis whitespace-nowrap text-xs font-bold text-white">{{ selectedFile.name }}</strong>
    <small class="text-gray-500 text-[10px]">Animation loops every 2 seconds</small>
  </div>
  <button *ngIf="processingState === 'COMPLETE'" class="inline-flex items-center justify-center px-6 py-3 rounded-xl font-bold text-sm cursor-pointer transition-all duration-200 border-none disabled:opacity-45 disabled:cursor-not-allowed bg-gradient-to-br from-purple-500 to-indigo-600 text-white shadow-[0_4px_15px_rgba(168,85,247,0.3)] hover:translate-y-[-1px] hover:shadow-[0_6px_20px_rgba(168,85,247,0.4)] w-full" (click)="onDownload()">Download selected short</button>

  <div class="flex flex-col gap-2.5 border-t border-white/5 pt-3.5 mt-4" *ngIf="processingState === 'COMPLETE' && result?.hooks?.length">
    <div class="flex justify-between text-[11px] font-bold text-white"><strong>{{ result!.hooks.length }} sections</strong><span class="text-gray-500">Choose the output to preview</span></div>
    <button *ngFor="let hook of result!.hooks; let i = index" class="grid grid-cols-[28px_1fr] gap-2.5 w-full p-2.5 bg-white/[0.02] border border-white/5 rounded-xl text-left text-white cursor-pointer transition-all duration-200 hover:bg-white/[0.05] hover:border-white/15 hover:-translate-y-0.5 active:translate-y-0 active:scale-[0.99]" [ngClass]="{ 'bg-purple-500/5 border-purple-500/50 shadow-[0_4px_15px_-3px_rgba(168,85,247,0.2)]': hook === selectedHook }" (click)="onSelectHook(hook)">
      <span class="text-purple-500 text-[10px] font-extrabold">0{{ i + 1 }}</span>
      <span class="grid gap-0.5"><strong class="overflow-hidden text-ellipsis whitespace-nowrap text-xs font-semibold text-white">{{ hook.title }}</strong><small class="text-gray-500 text-[10px]">{{ hook.start_time | number:'1.1-1' }}s – {{ hook.end_time | number:'1.1-1' }}s</small></span>
    </button>
  </div>
</section>

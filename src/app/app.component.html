<div class="max-w-[1540px] mx-auto p-6">
  <!-- Top Navigation Header Component -->
  <app-header
    [selectedFile]="selectedFile"
    [processingState]="processingState"
    [inputMode]="inputMode"
    [videoUrlInput]="videoUrlInput"
    (inputModeChange)="setInputMode($event)"
    (videoUrlInputChange)="videoUrlInput = $event"
    (fileSelected)="setFile($event)"
    (processUrl)="processVideoUrl()"
    (reset)="reset()">
  </app-header>

  <!-- Bottom Previews and Styling Section (Two-column layout) -->
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 items-start">
    
    <!-- LEFT SIDE: Video Preview (Source Player, Canvas, Output hooks) -->
    <div class="flex flex-col gap-6">
      
      <!-- Source Player & Trimmer Component -->
      <app-trimmer
        [selectedFile]="selectedFile"
        [localVideoUrl]="localVideoUrl"
        [videoDuration]="videoDuration"
        [trimStart]="trimStart"
        [trimEnd]="trimEnd"
        [cropPosition]="cropPosition"
        (trimStartChange)="trimStart = $event"
        (trimEndChange)="trimEnd = $event"
        (metadataLoaded)="onMetadataLoaded($event)">
      </app-trimmer>

      <!-- Processing/Loading panel (visible on non-IDLE) -->
      <section *ngIf="processingState !== 'IDLE' && processingState !== 'ERROR'" class="bg-[#110f19]/82 border border-white/5 backdrop-blur-md rounded-2xl p-5 shadow-[0_10px_30px_-10px_rgba(0,0,0,0.5)] min-h-[420px] grid place-content-center gap-4 text-center">
        <div class="processing-orbit"><span></span></div>
        <div>
          <span class="text-purple-500 text-[10px] font-extrabold tracking-[0.14em] uppercase">PROCESSING</span>
          <h2 class="m-1 text-white font-bold text-xl">{{ processingState === 'COMPLETE' ? 'Your short is ready' : 'Building your short...' }}</h2>
          <p *ngIf="processingState !== 'COMPLETE'" class="text-gray-500 text-xs">{{ useAi ? 'Finding hooks and rendering locally.' : 'Rendering locally with FFmpeg. No AI tokens used.' }}</p>
        </div>
        <div class="bg-white/5 h-1.5 rounded-full w-full mt-2 overflow-hidden"><div class="bg-gradient-to-r from-purple-500 to-indigo-500 h-full transition-all duration-300" [style.width.%]="processingState === 'COMPLETE' ? 100 : uploadProgress"></div></div>
        <button *ngIf="processingState === 'COMPLETE'" class="bg-white/5 text-[#f4f4f5] border border-white/10 w-full mt-6 hover:bg-white/10 hover:border-white/20 inline-flex items-center justify-center gap-2 px-6 py-3 rounded-xl font-bold text-sm cursor-pointer transition-all duration-200" (click)="reset()">Create another</button>
      </section>

      <!-- Error feedbacks (if any error occurs) -->
      <section *ngIf="errorMessage" class="bg-red-500/5 border border-red-500/20 rounded-xl p-4 grid gap-2 items-start">
        <strong class="text-red-300 text-sm leading-relaxed">{{ errorMessage }}</strong>
        <pre *ngIf="errorDetail" class="max-h-[260px] mt-2 p-3 overflow-auto text-red-200 bg-black/30 rounded-lg text-[10px] whitespace-pre-wrap">{{ errorDetail }}</pre>
      </section>

      <!-- Output Canvas & Live Previews Component -->
      <app-canvas-preview
        [processingState]="processingState"
        [result]="result"
        [localVideoUrl]="localVideoUrl"
        [cropPosition]="cropPosition"
        [captionText]="captionText"
        [captionFont]="captionFont"
        [captionColor]="captionColor"
        [accentColor]="accentColor"
        [captionPosition]="captionPosition"
        [textAnimation]="textAnimation"
        [selectedFile]="selectedFile"
        [selectedHook]="selectedHook"
        [backendUrl]="backendUrl"
        (selectHook)="selectHook($event)"
        (download)="downloadVideo()">
      </app-canvas-preview>
    </div>

    <!-- RIGHT SIDE: Direct the look (Styling and Render triggers) Component -->
    <app-style-editor
      *ngIf="processingState === 'IDLE'"
      [cropPosition]="cropPosition"
      [captionText]="captionText"
      [captionFont]="captionFont"
      [captionColor]="captionColor"
      [accentColor]="accentColor"
      [captionPosition]="captionPosition"
      [textAnimation]="textAnimation"
      [useAi]="useAi"
      [selectedFile]="selectedFile"
      (cropPositionChange)="cropPosition = $event"
      (captionTextChange)="captionText = $event"
      (captionFontChange)="captionFont = $event"
      (captionColorChange)="captionColor = $event"
      (accentColorChange)="accentColor = $event"
      (captionPositionChange)="captionPosition = $event"
      (textAnimationChange)="textAnimation = $event"
      (useAiChange)="useAi = $event"
      (render)="processVideo()">
    </app-style-editor>
  </div>
</div>
